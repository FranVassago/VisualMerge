box_id_query = SELECT MIN(CODCNTSSCC) BARCODE FROM VDCNTSSCC WHERE CODCNTSSCC NOT IN (SELECT MATCAJA FROM VDBULTOCAB WHERE MATCAJA IS NOT NULL AND STATUS > -VDST.FBUCFINALIZADO AND STATUS < VDST.FBUCFINALIZADO)
tracking_id_query = SELECT NVL(MAX(TRACKINGIDHOST),0) + 1 FROM VDBULTOSCANHIST WHERE TRACKINGIDHOST IS NOT NULL
reinduction_box_id_query = SELECT MATCAJA\n  FROM TABLE ( XVDPLC.BULTOS_EN_CIRCUITO )\n WHERE NEXTSCANNERHOST = :related_scan\n ORDER BY VD.TO_DATE(FECCREA, HORACREA)\n FETCH FIRST 1 ROWS ONLY
